name: 🐛 BUG 反馈 / Bug Report
description: 报告 SCUM 小地图的问题，帮助我们定位和修复。
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先查看 [官网常见问题](https://scumhan.github.io/scum-minimap/) 和已有 Issues。
        Thanks for helping improve SCUM MiniMap. Please check the FAQ and existing issues first.
  - type: input
    id: version
    attributes:
      label: 软件版本 / App version
      placeholder: "例如 v1.5.6"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本 / Windows version
      placeholder: "例如 Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题模块 / Affected area
      options:
        - 启动与安装 / Startup & installation
        - 地图显示 / Map display
        - 坐标与定位 / Position
        - 队友共享 / Teammate sharing
        - 标记 / Markers
        - 导航 / Navigation
        - 夜视滤镜 / Night vision
        - 更新 / Updater
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 按顺序写出如何触发问题。
      placeholder: |
        1. 打开软件……
        2. 进入……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志 / Screenshot or logs
      description: 可拖入截图。上传前请遮挡账号、IP、个人路径等隐私信息。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单 / Checklist
      options:
        - label: 我已查看官网常见问题和已有 Issues。
          required: true
        - label: 我没有提交密码、账号令牌或其他敏感信息。
          required: true
