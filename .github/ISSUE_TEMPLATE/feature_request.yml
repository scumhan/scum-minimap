name: 💡 功能建议 / Feature Request
description: 提出能让 SCUM MiniMap 更好用的新功能或改进。
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述实际使用场景，以及这个改进能解决什么问题。
        Describe the use case and the problem this feature would solve.
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / Problem
      placeholder: 目前使用时，什么地方不方便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎样改进 / Proposed solution
      placeholder: 描述你希望新增或调整的功能。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 如果有其他做法，也可以写在这里。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单 / Checklist
      options:
        - label: 我已搜索现有 Issues，确认没有重复建议。
          required: true
