<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1418">
<title>中转连通性诊断</title>
<style>
  :root{
    --bg:#0e1418; --card:#17222a; --line:#22323d; --txt:#dbe7ef; --dim:#8fa6b4;
    --ok:#3ddc84; --bad:#ff6b6b; --warn:#ffc046;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:16px 14px 40px;background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  h1{font-size:19px;margin:0 0 6px;font-weight:600}
  .sub{margin:0 0 14px;color:var(--dim);font-size:13px}
  .env{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:12px;color:var(--dim);line-height:1.7;word-break:break-all;margin-bottom:14px;
  }
  .env b{color:var(--txt);font-weight:500}
  .row{
    display:flex;align-items:flex-start;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;
  }
  .row .dot{
    flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:6px;background:#3b4a55;
  }
  .row.ok .dot{background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.6)}
  .row.bad .dot{background:var(--bad)}
  .row.run .dot{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .row .body{flex:1;min-width:0}
  .row .nm{font-size:14px;font-weight:500}
  .row .u{font-size:11px;color:var(--dim);word-break:break-all;margin-top:2px}
  .row .rs{font-size:12px;margin-top:4px}
  .row.ok .rs{color:var(--ok)}
  .row.bad .rs{color:var(--bad)}
  .row.run .rs{color:var(--warn)}
  .sum{
    margin:16px 0 12px;padding:12px;border-radius:10px;font-size:14px;line-height:1.6;
    background:#132029;border:1px solid var(--line);
  }
  .sum.ok{border-color:rgba(61,220,132,.5)}
  .sum.bad{border-color:rgba(255,107,107,.5)}
  .sum b{color:#fff}
  .btns{display:flex;gap:10px}
  button{
    flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:#1d2b34;color:var(--txt);font-size:14px;font-family:inherit;
  }
  button:active{background:#24343f}
  .foot{margin-top:16px;font-size:11px;color:#5d7280;line-height:1.6}
</style>
</head>
<body>
<h1>中转连通性诊断</h1>
<p class="sub">全部自动测，不用点。绿色 = 这条通道在你的网络下能连上。</p>

<div class="env" id="env">读取环境信息…</div>
<div id="list"></div>
<div class="sum" id="sum">正在测…</div>
<div class="btns">
  <button id="again" type="button">重测一遍</button>
  <button id="copy" type="button">复制结果</button>
</div>
<div class="foot">
  说明：握手失败的耗时很短（几百毫秒）通常是「端口被拒/被拦」；一直卡到 6 秒超时通常是「包被丢」。
  不管哪种，都说明这条通道在你这网络下用不了。
</div>

<script>
(function () {
  'use strict';

  // 电脑端和手机端现在用的就是这个。测不通就是它。
  var EPS = [
    { n: 'EMQX 国际 · 8084', u: 'wss://broker.emqx.io:8084/mqtt', cur: true },
    { n: 'EMQX 国内节点 · 8084', u: 'wss://broker-cn.emqx.io:8084/mqtt' },
    { n: 'HiveMQ 公共 · 8884', u: 'wss://broker.hivemq.com:8884/mqtt' },
    { n: 'Mosquitto 测试 · 8081', u: 'wss://test.mosquitto.org:8081/mqtt' },
    { n: 'Eclipse 公共 · 443', u: 'wss://mqtt.eclipseprojects.io:443/mqtt' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var rows = {};
  var results = {};

  function paintEnv() {
    var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
    var bits = [];
    bits.push('网络：<b>' + (c.effectiveType || '未知') + '</b>' +
      (c.downlink ? ' · 下行约 ' + c.downlink + 'Mbps' : '') +
      (c.rtt ? ' · RTT ' + c.rtt + 'ms' : ''));
    bits.push('省流量模式：<b>' + (c.saveData ? '开' : '关') + '</b>');
    bits.push('页面：' + location.host + location.pathname);
    bits.push('UA：' + navigator.userAgent);
    $('env').innerHTML = bits.join('<br>');
  }

  function addRow(e) {
    var d = document.createElement('div');
    d.className = 'row run';
    d.innerHTML = '<span class="dot"></span><div class="body">' +
      '<div class="nm">' + e.n + (e.cur ? '（现在用的）' : '') + '</div>' +
      '<div class="u">' + e.u + '</div>' +
      '<div class="rs">测试中…</div></div>';
    $('list').appendChild(d);
    rows[e.u] = d;
  }

  function setRow(u, ok, ms, why) {
    var d = rows[u];
    if (!d) return;
    d.className = 'row ' + (ok ? 'ok' : 'bad');
    d.querySelector('.rs').textContent = ok
      ? '✅ 能连上 · ' + Math.round(ms) + 'ms'
      : '❌ ' + why + ' · ' + Math.round(ms) + 'ms';
  }

  function testWs(u) {
    return new Promise(function (res) {
      var t0 = performance.now(), done = false;
      var w = null;
      function fin(ok, why) {
        if (done) return;
        done = true;
        clearTimeout(tm);
        try { if (w) { w.onopen = w.onerror = w.onclose = null; w.close(); } } catch (e) {}
        res({ ok: ok, ms: performance.now() - t0, why: why || '' });
      }
      var tm = setTimeout(function () { fin(false, '超时（6 秒没握上手，包被丢了）'); }, 6000);
      try {
        w = new WebSocket(u, 'mqtt');
      } catch (e) {
        return fin(false, '浏览器拒绝建连');
      }
      w.onopen = function () { fin(true, ''); };
      w.onerror = function () { fin(false, '握手失败（端口被拒或被拦）'); };
      w.onclose = function () { fin(false, '连接被关闭'); };
    });
  }

  function run() {
    $('list').innerHTML = '';
    rows = {};
    results = {};
    $('sum').className = 'sum';
    $('sum').textContent = '正在测…';
    paintEnv();

    // 基线：443 能不能通。这一条挂了说明整台手机都上不了网，后面的结果没意义
    EPS.forEach(addRow);

    var left = EPS.length;
    var greens = [];

    EPS.forEach(function (e) {
      testWs(e.u).then(function (r) {
        results[e.u] = r;
        setRow(e.u, r.ok, r.ms, r.why);
        if (r.ok) greens.push(e);
        if (--left === 0) finish(greens);
      });
    });
  }

  function finish(greens) {
    var s = $('sum');
    if (greens.length) {
      s.className = 'sum ok';
      s.innerHTML = '能用的通道：<br><b>' + greens.map(function (g) {
        return g.n + ' → ' + Math.round(results[g.u].ms) + 'ms';
      }).join('<br>') + '</b><br><br>把这一屏截图发给电脑那边就行。';
    } else {
      s.className = 'sum bad';
      s.innerHTML = '五个端点一个都没连上。<br>' +
        '<b>说明这个网络对非标准端口做了限制（或把 broker 域名污染了）。</b><br>' +
        '这种情况下只能走 443 端口的反代，没有别的办法。';
    }
  }

  $('again').onclick = run;

  $('copy').onclick = function () {
    var c = navigator.connection || {};
    var lines = ['SCUM 小地图 · 中转诊断', '网络：' + (c.effectiveType || '未知') + ' / 省流量：' + (c.saveData ? '开' : '关'), 'UA：' + navigator.userAgent, ''];
    EPS.forEach(function (e) {
      var r = results[e.u];
      lines.push((r ? (r.ok ? '✅ ' : '❌ ') : '… ') + e.n + ' ' + e.u + (r ? '  ' + Math.round(r.ms) + 'ms ' + (r.why || '') : ''));
    });
    var txt = lines.join('\n');
    var done = function () { $('copy').textContent = '已复制'; setTimeout(function () { $('copy').textContent = '复制结果'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { alert(txt); });
    } else {
      alert(txt);
    }
  };

  run();
})();
</script>
</body>
</html>
